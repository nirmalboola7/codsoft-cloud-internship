```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cloud Data Deduplication</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>☁️ Cloud Data Deduplication</h1>

        <p>
            Upload files and automatically prevent duplicates.
        </p>


        <!-- File Upload Section -->

        <div class="upload-section">

            <input
                type="file"
                id="fileInput"
            >

            <button onclick="uploadFile()">
                Upload File
            </button>

        </div>


        <!-- Upload Result -->

        <div id="result">
        </div>


        <!-- Dashboard -->

        <div class="dashboard">

            <!-- Unique Files -->

            <div class="card">

                <h3>Unique Files</h3>

                <p id="uniqueFiles">
                    0
                </p>

            </div>

            <div class="card">

                <h3>Upload Attempts</h3>

                <p id="uploadAttempts">
                    0
                </p>

            </div>
            <div class="card">

                <h3>Duplicates Blocked</h3>

                <p id="duplicatesBlocked">
                    0
                </p>

            </div>


            <!-- Storage Used -->

            <div class="card">

                <h3>Storage Used</h3>

                <p id="storageUsed">
                    0 bytes
                </p>

            </div>


            <!-- Storage Saved -->

            <div class="card">

                <h3>Storage Saved</h3>

                <p id="storageSaved">
                    0 bytes
                </p>

            </div>

        </div>

    </div>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
```
